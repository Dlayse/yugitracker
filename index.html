<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Yugi-Tracker — Tu colección de Yu-Gi-Oh!</title>
    <meta
      name="description"
      content="Organiza tu colección de cartas de Yu-Gi-Oh! en carpetas: rareza, estado, edición, idioma y valor de cada carta."
    />
    <meta name="theme-color" content="#050507" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Yugi-Tracker — Tu colección de Yu-Gi-Oh!" />
    <meta
      property="og:description"
      content="Organiza tu colección de cartas de Yu-Gi-Oh! en carpetas: rareza, estado, edición, idioma y valor de cada carta."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Las carátulas vienen de aquí: adelantar el handshake acelera la primera pintada. -->
    <link rel="preconnect" href="https://images.ygoprodeck.com" />

    <script>
      /*
       * Aplica el tema guardado ANTES de la primera pintada. Sin esto se ve un
       * parpadeo con los colores por defecto hasta que React monta y corre el
       * efecto que lee localStorage.
       */
      (function () {
        try {
          var raw = localStorage.getItem('yugi-tracker-platinum-theme');
          if (!raw) return;
          var t = JSON.parse(raw);
          var root = document.documentElement;
          var set = function (name, value) {
            if (typeof value === 'string') root.style.setProperty(name, value);
          };
          set('--rgb-primary', t.primary);
          set('--rgb-bg-body', t.bgBody);
          set('--rgb-bg-surface', t.bgSurface);
          set('--rgb-bg-panel', t.bgPanel);
          if (t.isDark === false) {
            set('--rgb-text-main', '20 20 20');
            set('--rgb-text-muted', '75 85 99');
            root.classList.remove('dark');
          }
        } catch (e) {
          /* Un tema corrupto no debe impedir que cargue la aplicación. */
        }
      })();
    </script>
  </head>
  <body class="antialiased overflow-y-scroll transition-colors duration-500">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
